<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Tomas Pentikäinen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=6" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=6" sizes="32x32" type="image/png">
<meta name="theme-color" content="#f5f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
:root{
  --ink:#0a0a0a;--ink-50:rgba(10,10,10,.64);--line:rgba(10,10,10,.1);
  --bg:#fff;--light:#f5f5f7;--soft:#ececec;--black:#0a0a0a;
  --sky:#00c2e8;--sky-ink:#007a99;
  --font:'Inter Tight',helvetica,arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 18px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
strong{font-weight:600}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:#fff;padding:8px 12px;border-radius:8px;z-index:99}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:6px}
.wrap{max-width:1376px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 16px}}
.sky{color:var(--sky-ink)}h1 .sky,h2 .sky{color:#008cb0}

/* circle arrow */
.arrow{display:inline-flex;align-items:center;gap:10px;font-weight:400;font-size:16px}
.arrow i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:14px;transition:transform .2s}
.arrow:hover i{transform:translateX(3px)}
.light-arrow i{background:#fff;color:var(--ink)}

/* NAV — floating frosted bar */
.nav{position:fixed;top:14px;left:14px;right:14px;z-index:50;border-radius:14px;transition:background .3s,box-shadow .3s}
.nav.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 0 0 1px var(--line)}
.nav .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;padding:0 20px}
.nav .logo{font-weight:600;font-size:20px;letter-spacing:-.03em}
.nav ul{display:flex;gap:34px;list-style:none;margin:0;padding:0;font-size:16px}
.nav ul a{opacity:.75}.nav ul a:hover{opacity:1}
.nav .contact{justify-self:end}
@media (max-width:760px){.nav ul{display:none}.nav .in{grid-template-columns:1fr auto}}

/* HERO — light, full-bleed photo on the right */
.hero{position:relative;min-height:100svh;background:var(--light);display:grid;grid-template-columns:1fr min(44vw,640px);overflow:hidden}
.hero .copy{display:flex;flex-direction:column;justify-content:center;padding:150px 56px 150px max(32px,calc((100vw - 1376px)/2 + 32px));position:relative;z-index:2}
.hero .who{font-weight:500;font-size:18px;margin:0 0 20px;color:var(--ink-50)}
.hero h1{font-weight:300;font-size:clamp(38px,4.6vw,66px);line-height:1.07;letter-spacing:-.03em;margin:0 0 36px;max-width:820px}
.capsule{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid rgba(10,10,10,.16);border-radius:999px;padding:5px;width:max-content;max-width:100%;font-size:14px;background:rgba(255,255,255,.5)}
.capsule span{background:#fff;border-radius:999px;padding:5px 11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px;box-shadow:0 0 0 1px var(--line)}
.capsule a{padding:4px 12px 4px 6px;font-weight:400}
.hero .photo{position:relative}
.hero .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero .photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--light) 0%,rgba(245,245,247,.5) 10%,rgba(245,245,247,0) 30%)}
.hero .worked{position:absolute;left:0;right:0;bottom:0;z-index:3;border-top:1px solid var(--line);background:rgba(255,255,255,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero .worked .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:14px 44px;padding-top:20px;padding-bottom:20px}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);font-weight:500}
.hero .worked ul{display:flex;flex-wrap:wrap;align-items:center;gap:16px 44px;list-style:none;margin:0;padding:0}
.blk{filter:brightness(0)}
.wht{filter:brightness(0) invert(1)}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero .photo{order:-1;height:64svh;min-height:420px}
  .hero .photo::before{background:linear-gradient(0deg,var(--light) 0%,rgba(245,245,247,.4) 18%,rgba(245,245,247,0) 42%)}
  .hero .copy{padding:4px 16px 170px}
}

/* SECTIONS */
section{padding:140px 0}
@media (max-width:640px){section{padding:88px 0}}
.wash{background:radial-gradient(50% 40% at 0% 25%,rgba(142,227,245,.28),transparent 70%),radial-gradient(45% 40% at 100% 75%,rgba(187,247,208,.42),transparent 70%),#fff}
.statement{text-align:center}
.statement h2{font-weight:300;font-size:clamp(32px,3.9vw,56px);line-height:1.1;letter-spacing:-.025em;max-width:1000px;margin:0 auto 30px}
.small-cap{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin:0 0 18px}

/* WORK GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 24px;margin-top:96px;text-align:left}
@media (max-width:980px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr;gap:40px}}
.card .media{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.card .media .bg{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card .media::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 75% 10%,rgba(255,255,255,.25),transparent 60%)}
.card:hover .media .bg{transform:scale(1.06)}
.card .media img{position:relative;z-index:1;max-width:56%;max-height:34%;width:auto;height:auto}
.card .media .mark{position:relative;z-index:1;color:#fff;text-align:center;font-weight:600;letter-spacing:-.03em;font-size:clamp(24px,2.3vw,34px);line-height:1.05}
.card .media .mark small{display:block;font-weight:300;font-size:15px;letter-spacing:0;margin-top:8px;opacity:.92}
.card h3{font-weight:500;font-size:20px;letter-spacing:-.01em;margin:16px 0 2px}
.card p{margin:0 0 12px;color:var(--ink-50);font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags li{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;background:rgba(10,10,10,.06);border-radius:999px;padding:5px 10px}

/* NUMBERS */
.numbers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:64px}
.numbers div{padding:44px 32px;text-align:center}
.numbers div+div{border-left:1px solid var(--line)}
.numbers b{display:block;font-weight:300;font-size:clamp(48px,5.6vw,84px);letter-spacing:-.045em;line-height:1}
.numbers span{display:block;margin-top:14px;color:var(--ink-50);font-size:17px}
@media (max-width:760px){.numbers{grid-template-columns:1fr}.numbers div+div{border-left:0;border-top:1px solid var(--line)}}
.note{text-align:center;color:var(--ink-50);font-size:16px;margin:22px 0 0}

/* LOGO WALL */
.wall{display:grid;grid-template-columns:repeat(4,1fr);margin-top:72px}
.wall>*{aspect-ratio:16/10;display:grid;place-items:center;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.wall>*:nth-child(4n+1){border-left:0}
.wall>*:nth-child(-n+4){border-top:0}
.wall img{max-width:50%;max-height:32%;width:auto;height:auto;opacity:.9;transition:opacity .2s,transform .3s}
.wall>*:hover img{opacity:1;transform:scale(1.04)}
@media (max-width:760px){.wall{grid-template-columns:repeat(2,1fr)}.wall>*{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)!important}.wall>*:nth-child(2n+1){border-left:0!important}.wall>*:nth-child(-n+2){border-top:0!important}}

/* CASE PANELS */
.panel{background:var(--light);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:72px;padding:56px;align-items:center;margin-top:24px}
.panel .visual{aspect-ratio:1/1;border-radius:6px;position:relative;overflow:hidden;display:grid;place-items:center}
.panel .visual img{position:relative;z-index:1;max-width:54%;max-height:28%;width:auto;height:auto}
.panel .visual .mark{position:relative;z-index:1;color:#fff;font-weight:600;font-size:clamp(28px,3vw,44px);letter-spacing:-.03em;text-align:center;line-height:1.05}
.panel blockquote{margin:0 0 22px;font-weight:300;font-size:clamp(26px,2.6vw,38px);line-height:1.18;letter-spacing:-.025em}
.panel .by{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:0 0 26px;line-height:1.55}
.panel ul{margin:0 0 28px;padding:0;list-style:none}
.panel li{padding:12px 0;border-top:1px solid var(--line);font-size:17px}
.panel li b{font-weight:500}
.pill{display:inline-flex;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-weight:400;font-size:16px;transition:transform .15s}
.pill:hover{transform:translateY(-1px)}
@media (max-width:900px){.panel{grid-template-columns:1fr;gap:32px;padding:24px}.panel .visual{aspect-ratio:16/10}}

/* BLACK BLOCK (Bou-style, neutral) */
.blackblock{background:var(--black);color:#fff;border-radius:8px;padding:120px 56px 56px;position:relative;overflow:hidden}
.blackblock .head{text-align:center;max-width:820px;margin:0 auto 80px;position:relative}
.blackblock h2{font-weight:300;font-size:clamp(32px,4vw,56px);line-height:1.1;letter-spacing:-.025em;margin:0 0 22px}
.blackblock .head p{color:rgba(255,255,255,.62);margin:0 auto;max-width:560px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.cards3 article{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:8px;padding:26px}
.cards3 h3{font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0 0 10px}
.cards3 p{margin:0;color:rgba(255,255,255,.62);font-size:16.5px}
@media (max-width:900px){.cards3{grid-template-columns:1fr}.blackblock{padding:72px 20px 20px}}

/* ABOUT + EXPERIENCE */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:80px}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:56px}}
.about h2{font-weight:300;font-size:clamp(32px,3.6vw,52px);letter-spacing:-.025em;line-height:1.1;margin:0 0 28px}
.about p{margin:0 0 18px;font-size:19px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr 124px;gap:20px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.tl li:last-child{border-bottom:1px solid var(--line)}
.tl .when{color:var(--ink-50);font-size:15px}
.tl b{display:block;font-weight:500;font-size:17px}
.tl span{color:var(--ink-50);font-size:15.5px}
.tl .lg{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.tl .lg img{max-height:22px;max-width:124px;width:auto;height:auto}
@media (max-width:560px){.tl li{grid-template-columns:1fr auto;gap:4px 16px}.tl .when{grid-column:1/-1}}

/* CONTACT */
.contact{text-align:center}
.contact h2{font-weight:300;font-size:clamp(44px,7vw,104px);letter-spacing:-.045em;line-height:1;margin:0 0 26px}
.contact p{color:var(--ink-50);margin:0 auto 36px;max-width:560px}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:28px;padding-bottom:36px;font-size:15px;color:var(--ink-50)}

.duo{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.duo .plus{font-weight:300;font-size:28px;color:rgba(10,10,10,.45)}
.bt{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:26px;letter-spacing:-.02em;color:#0a0a0a}
.wall .bt.big img{max-width:none;max-height:none;height:clamp(34px,3.4vw,48px);width:auto;opacity:1}
.wall .bt.big{font-size:clamp(18px,1.9vw,26px)}
.shel{filter:brightness(0);opacity:.87}
.media.split{display:grid;grid-template-columns:1fr 1fr;place-items:stretch}
.media.split::after{display:none}
.media.split .half{display:grid;place-items:center;position:relative;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.media.split .cm{background:linear-gradient(135deg,#006d87 0%,#00a6cc 60%,#33d0ee 100%)}
.media.split .br{background:#fafafa;border-left:1px solid rgba(10,10,10,.06)}
.media.split .cm img{max-width:72%;max-height:none;height:auto}
.media.split .br .bt{font-size:clamp(17px,1.6vw,22px)}
.media.split .br .bt img{height:clamp(30px,2.6vw,40px);width:auto;max-width:none;max-height:none}
.card:hover .media.split .half{transform:scale(1.03)}
.panel .visual .pair{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
.panel .visual .pair img{max-width:52%;max-height:none;width:auto;height:auto}
.panel .visual .pair img[alt="Shelter"]{width:52%}
.panel .visual .pair img[alt="Teller"]{width:40%}
.panel .visual .pair .sep{width:48px;height:1px;background:rgba(255,255,255,.35)}
/* MOBILE FIXES */
html,body{overflow-x:hidden}
.hero h1{overflow-wrap:break-word}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .copy{padding:8px 20px 28px;min-width:0}
  .hero .worked{position:static;background:#fff}
  .hero .worked .wrap{gap:12px 26px;padding-top:18px;padding-bottom:18px}
  .hero .worked ul{gap:14px 26px}
  .capsule{width:auto;border-radius:18px}
  .capsule a{word-break:break-all}
}
@media (max-width:760px){
  .nav nav{display:none}
  .nav .in{grid-template-columns:1fr auto;padding:0 14px 0 18px;height:54px}
  .nav{top:10px;left:10px;right:10px}
  .grid{margin-top:56px}
  .wall>*{aspect-ratio:3/2}
  .numbers div{padding:32px 12px}
  .panel blockquote{font-size:24px}
  .contact h2{font-size:48px}
  .statement h2{font-size:30px}
}
@media (max-width:420px){
  .hero h1{font-size:34px}
  .capsule span{font-size:10.5px;padding:4px 9px}
  .capsule a{font-size:13px}
}
.tl .lg{flex:none}
.tl .lg img{flex:none}
.numbers.pillars{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.numbers.pillars{grid-template-columns:1fr 1fr}.numbers.pillars div:nth-child(3){border-left:0}.numbers.pillars div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:760px){.numbers.pillars{grid-template-columns:1fr}.numbers.pillars div{border-left:0!important}.numbers.pillars div+div{border-top:1px solid var(--line)}}
.pillars b{font-size:clamp(28px,2.6vw,36px)!important;color:var(--sky-ink)}
.pillars h3{font-weight:600;font-size:22px;letter-spacing:-.02em;margin:14px 0 0}
.pillars span{max-width:300px;margin-left:auto;margin-right:auto}
.feature{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:24px 0 0}
.feature .ic{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff}
.feature b{display:block;font-weight:600;font-size:20px;letter-spacing:-.02em}
.feature span{display:block;color:var(--ink-50);font-size:15px;line-height:1.4}
.card .media .stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.card .media .stack>img{max-width:46%;max-height:none;height:auto}
.card .media .stack .sep{width:40px;height:1px;background:rgba(255,255,255,.45)}
.card .media .stack .bt.w{color:#fff;font-size:clamp(20px,1.9vw,27px)}
.card .media .stack .bt.w img{height:clamp(32px,2.8vw,42px);width:auto;max-width:none;max-height:none}
.cform{max-width:680px;margin:8px auto 0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(10,10,10,.06)}
.cform label{display:block;font-size:14px;font-weight:500;margin:0 0 16px;color:var(--ink)}
.cform input,.cform select,.cform textarea{display:block;width:100%;margin-top:6px;font:400 16px/1.4 var(--font);color:var(--ink);background:#f5f5f7;border:1px solid transparent;border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
.cform textarea{resize:vertical;min-height:120px}
.cform input:focus,.cform select:focus,.cform textarea:focus{outline:none;background:#fff;border-color:var(--sky)}
.cform .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cform .actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:4px}
.cform button.pill{border:0;cursor:pointer;font:400 16px var(--font);gap:10px}
.cform button.pill i{font-style:normal}
.cform .alt{font-size:14px;color:var(--ink-50)}
.cform .alt a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.cform .fmsg{margin:12px 0 0;font-size:14px;color:var(--sky-ink);min-height:1em}
.cform .bad{border-color:#dc2626!important;background:#fff}
@media (max-width:560px){.cform{padding:20px}.cform .row2{grid-template-columns:1fr;gap:0}}
.wall>a{transition:background .2s}
.wall>a:hover{background:rgba(255,255,255,.6)}
.wall>a:focus-visible{outline-offset:-4px}
/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.card .media .bg{transition:none}}
.hub{position:relative;margin-top:12px;display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center;border:1px solid rgba(142,227,245,.35);background:linear-gradient(135deg,rgba(142,227,245,.12),rgba(255,255,255,.03));border-radius:8px;padding:36px}
.hub h3{font-weight:500;font-size:clamp(24px,2.4vw,32px);letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
.hub p{margin:0;color:rgba(255,255,255,.62);font-size:16.5px}
.hub ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
.hub li b{display:block;font-weight:500;margin-bottom:4px}
.hub li span{color:rgba(255,255,255,.62);font-size:15.5px}
@media (max-width:900px){.hub{grid-template-columns:1fr;gap:28px;padding:24px}}
@media (max-width:560px){.hub ul{grid-template-columns:1fr}}
.lp-hero{background:var(--light);padding:170px 0 110px}
.lp-hero .who{font-weight:500;font-size:18px;margin:0 0 20px;color:var(--ink-50)}
.lp-hero h1{font-weight:300;font-size:clamp(40px,5.4vw,76px);line-height:1.05;letter-spacing:-.035em;margin:0 0 30px;max-width:980px}
.lp-hero .lead{font-size:clamp(19px,1.6vw,22px);line-height:1.5;max-width:760px;margin:0 0 36px;color:var(--ink)}
.lp-hero .pill{gap:10px}.lp-hero .pill i{font-style:normal}
.offer{max-width:760px;margin:0 auto;background:var(--light);border-radius:18px;padding:56px 40px}
.offer h2{font-weight:300;font-size:clamp(32px,3.6vw,50px);letter-spacing:-.025em;line-height:1.1;margin:0 0 18px}
.offer p{color:var(--ink-50);max-width:580px;margin:0 auto 28px}
.offer .small-cap{margin-bottom:14px;color:var(--sky-ink)}
.offer .pill{gap:10px}.offer .pill i{font-style:normal}
@media (max-width:640px){.offer{padding:40px 22px}}
.lp-grid{display:grid;grid-template-columns:1fr minmax(260px,400px);gap:56px;align-items:center}
.lp-photo{margin:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:#e9e9ec}
.lp-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
